<svg xmlns="http://www.w3.org/2000/svg" width="977" height="602" viewBox="0 0 977 602" role="img" aria-labelledby="title desc">
  <title id="title">Jarvis media control</title>
  <desc id="desc">Jarvis conversation showing Spotify opening, playback toggling, and next track control.</desc>
  <defs>
    <radialGradient id="orb" cx="35%" cy="25%" r="70%">
      <stop offset="0" stop-color="#9ee8ff"/><stop offset="0.45" stop-color="#37bff2"/><stop offset="1" stop-color="#0e5479"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="20" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="977" height="602" fill="#020712"/>
  <rect y="0" width="977" height="36" fill="#1d1d1d"/>
  <text x="27" y="83" fill="#f6fbff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="10">JARVIS<tspan fill="#1ebfff">.</tspan></text>
  <text x="902" y="81" fill="#8fb7ef" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="4">STANDBY</text>
  <circle cx="496" cy="176" r="58" fill="url(#orb)" filter="url(#glow)"/>
  <rect x="789" y="288" width="169" height="31" rx="8" fill="#072238" stroke="#0a7fab"/>
  <text x="873" y="304" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14">Can you open Spotify?</text>
  <rect x="28" y="331" width="155" height="43" rx="10" fill="#101b31" stroke="#263f6d"/>
  <text x="44" y="357" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Spotify is now open.</text>
  <rect x="712" y="383" width="246" height="43" rx="12" fill="#072238" stroke="#0a7fab"/>
  <text x="835" y="410" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14">Can you play the music on Spotify?</text>
  <rect x="28" y="436" width="306" height="43" rx="10" fill="#101b31" stroke="#263f6d"/>
  <text x="44" y="464" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Music playback on Spotify has been toggled.</text>
  <rect x="765" y="490" width="193" height="43" rx="12" fill="#072238" stroke="#0a7fab"/>
  <text x="861" y="517" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14">Can you change the song?</text>
  <rect x="28" y="542" width="309" height="43" rx="10" fill="#101b31" stroke="#263f6d"/>
  <text x="44" y="570" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">The song has been changed to the next track.</text>
  <rect x="962" y="355" width="6" height="53" rx="3" fill="#203b72"/>
</svg>
